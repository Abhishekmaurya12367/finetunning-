model:
  base_model: Qwen/Qwen2.5-1.5B-Instruct
  use_4bit: false          # true = QLoRA, needs bitsandbytes (Linux/Colab)

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear

train:
  epochs: 3
  batch_size: 2
  grad_accum: 8
  learning_rate: 0.0002
  lr_scheduler: cosine
  warmup_ratio: 0.05
  max_length: 1024
  logging_steps: 5
  seed: 42
  gradient_checkpointing: true 

data:
  train_file: data/train.jsonl
  validation_file: data/validation.jsonl

generation:
  max_new_tokens: 300

output:
  output_dir: outputs
  adapter_name: lora_adapter